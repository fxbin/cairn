# Cairn 持续集成：基础门禁 + 扩展验证矩阵。
#
# 边界约定：
# - gate 在 push/PR 上运行 AGENTS.md 验证矩阵的可自动化子集，只跑默认标签测试。
# - extended 仅在手动触发（workflow_dispatch）或每周定时运行：race、faultinject、e2e。
# - 全程不配置任何密钥；fault/e2e 用例使用进程内脚本化 Provider 与回环端点，
#   不会调用真实 Provider 或付费服务；缺环境时用例显式失败，而非跳过后报告通过。
# - frontend 是与 gate 并列的独立 job：只跑 studio/frontend 的 typecheck/test/build，
#   依赖由 package-lock.json 固定并以 npm ci 全新安装，不借用开发机 node_modules；
#   gate/frontend/desktop 三个 job 不设 needs 依赖，各自跑在干净的 runner 上，
#   互不影响也不互相降低覆盖。
# - desktop 是 macOS 桌面壳门禁：gate 因 //go:embed 依赖前端产物而不编译桌面壳包
#   （见 gate 内注释的分组约定，该约定不变），桌面壳的 Go 编译与 vet 回归因此
#   远端抓不到。本 job 在 macos runner 上先构建前端产物，再编译、vet 并运行
#   桌面壳包既有测试，作为远端兜底；不覆盖 Linux/Windows 桌面壳，
#   也不含真机 E2E（后者依赖带 GUI 权限的桌面会话，见本地 smoke 清单）。
# - 恢复/审批场景矩阵与三级证据分层的完整文档在本地 docs/ci-verification-baseline.md，
#   桌面端最小 smoke 与手动签收清单在本地 docs/desktop-smoke-checklist.md
#   （按仓库约定不提交）；本文件的注释即上述边界的可提交表述。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周二 05:00（北京时间）全量复检；cron 使用 UTC
    - cron: '0 21 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基础门禁：格式漂移、静态检查、构建、默认标签全量测试
  gate:
    # 26.04 适配（Issue #37）：26.04 镜像自带 bubblewrap，host 收紧在 CI 上首次
    # 真正生效。沙箱根不再是只挂少数系统目录的空 tmpfs，而是逐条只读映射宿主
    # 根条目（含 /lib64 等加载器别名），临时目录根与工作区可写，随后整体重挂
    # 只读；参数与理由见 internal/runtime/tools/ossandbox_linux.go。
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # studio 是 Wails 桌面壳，编译依赖本地前端构建产物
      # studio/frontend/dist（git 忽略，须先跑桌面的前端构建）；按约定单独
      # 分组，不进默认门禁，go list 仅列举 cmd/internal/test，避免因缺产物而中断。
      - name: gofmt 漂移检查
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "以下文件未通过 gofmt："
            echo "$drift"
            exit 1
          fi
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./test/...
      - name: 构建 CLI
        run: go build ./cmd/cairn
      # internal/benchmark 的 runner 测试强制 exec/验证走 Docker 沙箱（alpine:latest），
      # 预拉取公共镜像使该路径在 Linux 上真实执行；镜像缺失时按合同失败关闭。
      - name: 预拉取沙箱镜像
        run: docker pull alpine:latest
      - name: 默认标签全量测试
        run: go test ./cmd/... ./internal/... ./test/...

  # 前端门禁：studio/frontend 的类型检查、单测与生产构建。
  # 独立 job，不设 needs：与 Go gate 并行执行，任一失败只标记对应 job。
  # 前端依赖与产物都不进入 Go 门禁的覆盖范围：
  #   - studio/frontend/node_modules 与 studio/frontend/dist 由 studio/.gitignore 忽略，
  #     干净检出里都不存在，构建后也只落在被忽略路径上；
  #   - Go 门禁保持 go build ./cmd/cairn 的既有口径，不因本 job 降低或改动覆盖。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Node 主版本固定为 24：studio/frontend/package.json 未声明 engines 字段，
          # 本地三项门禁实测版本为 Node v24.15.0（npm 11.x），24 是当前 LTS 主线；
          # Vite 5 与 Vitest 2 的 engines 下限为 Node ^18 || >=20，24 同时满足。
          # 依赖版本由 package-lock.json 固定，Node 主版本固定后即可复现安装。
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      # npm ci 严格按锁文件安装，package.json 与锁文件不一致时直接失败；
      # 不使用 --ignore-scripts：esbuild 的安装脚本是 vite 构建链的一环。
      - name: 安装前端依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 前端单测
        run: npm test
      - name: 前端构建
        run: npm run build
      # studio/main.go 以 //go:embed all:frontend/dist 嵌入前端产物。干净检出缺少该目录时，
      # go build ./... 的失败原因只有这一条（基线既有事实），因此这里断言产物真的生成，
      # 让构建链回归在 PR 阶段就暴露，而不是留到桌面打包阶段才被发现。
      - name: 校验静态产物
        run: test -f dist/index.html
      # 前端构建只允许写入被忽略的目录；出现受版本控制的改动即判失败。
      - name: 确认构建未改动受版本控制的文件
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "前端构建改动了受版本控制的文件："
            echo "$dirty"
            exit 1
          fi

  # 桌面壳门禁：在 macOS 上编译 Wails 桌面端并运行桌面壳包既有测试。
  # 独立 job，不设 needs：与 gate/frontend 并行，任一失败只标记对应 job。
  # 覆盖边界：只验 macOS 桌面壳的编译、vet 与既有测试，不改变 gate/frontend
  # 的口径，不新增测试用例，也不代替真机 E2E 与 Linux/Windows 壳验证。
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Node 主版本与 frontend job 同口径（24）：studio/frontend/package.json 无
          # engines 声明，依赖由 package-lock.json 固定，主版本固定后即可复现安装。
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      # 前端产物是桌面壳包的编译前置：studio/main.go 的 //go:embed all:frontend/dist
      # 在干净检出里缺少 dist 时会让 go build/vet/test 全部失败，必须先构建。
      - name: 安装前端依赖
        working-directory: studio/frontend
        run: npm ci
      - name: 构建前端嵌入产物
        working-directory: studio/frontend
        run: npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # 输出显式 -o 固定产物名，避免在仓库根留下与源目录同名的二进制。
      - name: 编译桌面壳
        run: go build -o /tmp/cairn-desktop ./studio
      - name: go vet 桌面壳
        run: go vet ./studio
      # 只运行桌面壳包既有测试（server 端口解析等纯函数用例），不新增用例；
      # wails3 依赖 cgo，macos runner 自带完整工具链。
      - name: 桌面壳既有测试
        run: go test ./studio

  # 扩展矩阵：race、协议合同、故障注入与端到端；仅显式入口触发
  extended:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # 同 gate：benchmark 测试需要本地 Docker 与 alpine 镜像
      - name: 预拉取沙箱镜像
        run: docker pull alpine:latest
      - name: race 全量（桌面壳除外，同 gate 分组约定）
        run: go test -race ./cmd/... ./internal/... ./test/...
      - name: 协议合同测试
        run: go test ./internal/adapters/provider/openaicompat -run Contract -count=1
      - name: 故障注入（started 副作用对账）
        run: go test ./test/fault -tags=faultinject -count=1
      - name: 端到端（脚本化 Provider）
        run: go test ./test/e2e -tags=e2e -count=1

  # bwrap 边界门禁：extended 跑在 ubuntu-latest，该镜像没有 bubblewrap，
  # internal/runtime/tools 的沙箱边界用例与 e2e 信号用例会静默 skip，导致"绿"不代表
  # bwrap 路径被验证（与 24.04 假绿同源）。本 job 用 .github/docker 下显式
  # 安装 bubblewrap 的镜像，在 privileged 容器中实跑这两组用例；脚本同时做
  # 防空转断言：bwrap 缺失、出现 --- SKIP、目标用例缺少 --- PASS 都直接失败。
  bwrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 构建带 bubblewrap 的运行镜像
        run: docker build -f .github/docker/bwrap-e2e.Dockerfile -t cairn-bwrap-e2e:ci .
      # privileged 只用于在容器内建立 bwrap 命名空间与挂载；仓库目录以工作区
      # 挂载供测试创建夹具，容器退出即丢弃，不影响宿主其他路径。
      - name: 沙箱路径防空转门禁
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            cairn-bwrap-e2e:ci \
            bash .github/scripts/assert-bwrap-e2e.sh
